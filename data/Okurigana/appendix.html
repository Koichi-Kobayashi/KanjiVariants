<p class="text70 margin-0 padding-left-15"><a href="../../../../../index.html">HOME</a> &gt; <a href="../../../../index.html">国語施策・日本語教育</a> &gt; <a href="../../../index.html">国語施策情報</a> &gt; <a href="../index.html">内閣告示・内閣訓令</a> &gt; <a href="index.html">送り仮名の付け方</a> &gt; 本文　付表の語</p>
<div class="padding-left-15">

<h3 class="text120 margin-top-20 margin-bottom-10">送り仮名の付け方　付表の語</h3>

<div class="joho_main">

<p>「常用漢字表」の「付表」に掲げてある語のうち,送り仮名の付け方が問題となる次の語は次のようにする。</p>

<h5 class="normal">1　次の語は，次に示すように送る。</h5>
<div class="read_text">
浮<u>つく</u>　お巡<u>り</u>さん　差<u>し</u>支<u>える</u>　立<u>ち</u>退<u>く</u>　手伝<u>う</u>　最寄<u>り</u><br /><br />
<p>なお,次の語は，（　　）の中に示すように、送り仮名を省くことが出来る。</p>
差<u>し</u>支える（差支える）　立<u>ち</u>退く（立退く）
</div>

<h5 class="normal">2　次の語は送り仮名を付けない。</h5>
<div class="read_text">
息吹　桟敷　時雨　築山　名残　雪崩　吹雪　迷子　行方
</div>

</div>
</div>
